[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-queuer"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "spotipy>=2.24.0",
    "PySide6>=6.6.0",
    "rapidfuzz>=3.6.0",
    "watchdog>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
